# All-in-one dev compose: flezha controller + UI + kafka stack
# Usage:
#   docker compose -f docker-compose.dev.yml up [--build]
#
# Attach to iex:    docker attach flezha_controller  (detach: Ctrl+P Ctrl+Q)
# Get a bash shell: docker exec -it flezha_controller bash
# Restart iex:      docker exec flezha_controller pkill -f iex

# Each runner's credential, named once: its bootstrap step writes the token
# file for the namespace, and the runner reads that file to prove it.
x-default-runner-credential: &default-runner-credential
  FLEZHA_RUNNER_NAMESPACE: ${FLEZHA_DEMO_NAMESPACE:-default}
  FLEZHA_RUNNER_TOKEN_FILE: /auth/runner.token

# The Erlang distribution cookie, named once: the controller, the bootstrap
# steps, the console and every helper node run inside fui_web read this value.
x-dev-cookie: &dev-cookie
  ERLANG_COOKIE: flezha_dev_cookie

x-sandbox-runner-credential: &sandbox-runner-credential
  FLEZHA_RUNNER_NAMESPACE: sandbox
  FLEZHA_RUNNER_TOKEN_FILE: /auth/runner.sandbox.token

services:
  controller:
    build:
      # The toolchain image is what flezha's own deploy/docker/dev/docker-compose.yml
      # builds: Elixir+OTP, Rust, Node.js, protoc against bind-mounted source.
      context: ../flezha
      dockerfile: deploy/docker/dev/Dockerfile.toolchain
    container_name: flezha_controller
    hostname: flezha_controller
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/storage/app/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_GRACEFUL_SHUTDOWN_ENABLED: ${FLEZHA_GRACEFUL_SHUTDOWN_ENABLED:-true}
      FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-60000}
      # Off by default on the controller; on here so the UI's audit screen has
      # something to show in dev.
      FLEZHA_AUDIT_ENABLED: ${FLEZHA_AUDIT_ENABLED:-true}
      # Enforced, not switched off. The controller only enables authorization by
      # default under MIX_ENV=prod, and a dev stack that opted out would leave
      # the UI's whole identity path — token, principal, refusals — untested
      # locally. The `bootstrap` service below claims it.
      FLEZHA_AUTHZ_ENABLED: "true"
      # Absolute, so the bootstrap token's path does not depend on the cwd the
      # controller happened to start in.
      FLEZHA_AUTHZ_DIR: /flezha/storage/app/auth
      # The dev default already, stated because a controller with no durability
      # posture refuses to boot under prod config and the difference is worth
      # being able to see here.
      FLEZHA_DURABILITY_BACKEND: ${FLEZHA_DURABILITY_BACKEND:-none}
      <<: *dev-cookie
    depends_on:
      kafka:
        condition: service_healthy
      # The plugin root is read once, at boot.
      plugin_packages:
        condition: service_completed_successfully
    # Graceful shutdown — see flezha's docs/public/topics/deploying/deploying_a_controller.md.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: >
      sh -c 'while true; do
        pkill node 2>/dev/null;
        echo "==> Starting flezha iex...";
        mix deps.get >/dev/null;
        iex --sname flezha --cookie "$$ERLANG_COOKIE" -S mix;
        echo "==> iex exited, restarting in 3s...";
        sleep 3;
      done'
    volumes:
      - fui_socket_data:/socket_data
      - ../flezha:/flezha
      - fui_flezha_build:/flezha/_build
      - fui_flezha_deps:/flezha/deps
      - fui_flezha_cargo_target:/flezha/_build/.target
    networks:
      - fui_network

  # Builds the flezha_http plugin package with the controller's toolchain and
  # places it, with a copy the loader refuses, in the plugin root the
  # controller reads at boot. See priv/dev/plugin_packages.sh.
  plugin_packages:
    build:
      context: ../flezha
      dockerfile: deploy/docker/dev/Dockerfile.toolchain
    container_name: fui_plugin_packages
    restart: "no"
    command: ["sh", "/flezha_ui_dev/plugin_packages.sh"]
    volumes:
      - ../flezha:/flezha
      - ./priv/dev:/flezha_ui_dev:ro
      # Mounted over a directory the image gives its build user, so the
      # volume is that user's too.
      - fui_plugin_build:/home/flezha/_build
    networks:
      - fui_network

  # The runner is its own service, mirroring flezha's deploy/docker/dev/docker-compose.yml.
  # It owns its process, so it survives a controller restart on the SDK's own
  # reconnect loop — unlike a runner launched through the controller, which dies
  # with whatever process owned its Port.
  runner:
    build:
      context: ../flezha
      dockerfile: deploy/docker/dev/Dockerfile.toolchain
    container_name: flezha_rust_runner
    restart: unless-stopped
    # The runner exits when its stdin reaches EOF, which is how a controller
    # that owns its Port shuts it down. Without an open stdin, docker hands it
    # /dev/null and it exits immediately at startup.
    stdin_open: true
    tty: true
    depends_on:
      controller:
        condition: service_started
      # A controller enforcing authorization refuses a runner that cannot
      # prove its namespace; the bootstrap writes the credential it presents.
      bootstrap:
        condition: service_completed_successfully
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/storage/app/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      # The SDK's default under /var/lib is not writable by the image's user;
      # in its home the id survives a restart, so the runner is recognised.
      FLEZHA_RUNNER_ID_PATH: /home/flezha/.flezha-runner-id
      <<: *default-runner-credential
    working_dir: /flezha/test/apps/rust_runner
    command:
      - sh
      - -c
      - |
        until [ -S /flezha/storage/app/sockets/runner_control_channel.sock ]; do
          echo "[runner] waiting for controller control socket..."
          sleep 1
        done
        # `test/apps/rust_runner` links to the crate's real path, and cargo
        # resolves a workspace member only by that one.
        FLEZHA_NAMESPACE_SECRET="$$(cat "$$FLEZHA_RUNNER_TOKEN_FILE")"
        export FLEZHA_NAMESPACE_SECRET
        exec cargo run --quiet --manifest-path=/flezha/sdk/rust/test_app/Cargo.toml -- "$$FLEZHA_RUNNER_NAMESPACE"
    volumes:
      - fui_auth_data:/auth:ro
      - fui_socket_data:/socket_data
      - ../flezha:/flezha
      - fui_flezha_cargo_target:/flezha/_build/.target
    networks:
      - fui_network

  # A second runner, in a namespace of its own, running the Elixir project kept
  # in the git-ignored local_dev/sandbox_runners/elixir_runner. Started only with
  # `--profile local-runner`. It is the runner above — image, sockets, checkout,
  # credentials — plus the project and its own build volumes.
  sandbox_runner:
    extends:
      service: runner
    container_name: fui_sandbox_runner
    profiles: [local-runner]
    depends_on:
      sandbox_bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sandbox-runner-credential
      # Outside the mounted project, so a build on the host never shares a
      # _build or deps with this one.
      MIX_BUILD_ROOT: /home/flezha/_build
      MIX_DEPS_PATH: /home/flezha/deps
    # At the same depth as on the host, so a path dependency on
    # ../../../../flezha/sdk/elixir resolves in both.
    working_dir: /flezha_ui/local_dev/sandbox_runners/elixir_runner
    command:
      - sh
      - -c
      - |
        until [ -S /flezha/storage/app/sockets/runner_control_channel.sock ]; do
          echo "[sandbox_runner] waiting for controller control socket..."
          sleep 1
        done
        FLEZHA_NAMESPACE_SECRET="$$(cat "$$FLEZHA_RUNNER_TOKEN_FILE")"
        export FLEZHA_NAMESPACE_SECRET
        mix deps.get && exec mix run --no-halt -- "$$FLEZHA_RUNNER_NAMESPACE"
    volumes:
      - ./local_dev:/flezha_ui/local_dev
      # Mounted over directories the image gives its build user, so the
      # volumes are that user's too.
      - fui_sandbox_build:/home/flezha/_build
      - fui_sandbox_deps:/home/flezha/deps

  # Claims the controller's authorization bootstrap and issues the token the UI
  # presents, once, after the controller is up. It has to be a step rather than
  # an env var: the token does not exist until the controller has booted, and
  # `flz` cannot reach a controller running under `iex -S mix` (it shells out to
  # the release launcher, which a source checkout does not build).
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fui_bootstrap
    hostname: fui_bootstrap
    # Named volumes are created root-owned; this step has to write into one.
    user: root
    restart: "no"
    depends_on:
      controller:
        condition: service_started
    environment:
      <<: [*dev-cookie, *default-runner-credential]
      FLEZHA_NODE: flezha@flezha_controller
      FLEZHA_TOKEN_FILE: /auth/ui.token
      FLEZHA_UI_PRINCIPAL: flezha-ui
    volumes:
      - .:/flezha_ui
      - fui_auth_data:/auth
    networks:
      - fui_network
    # The script waits for the controller node itself, which is a better signal
    # than any file: a reachable node is one that can answer the claim.
    command:
      - sh
      - -c
      - exec elixir --sname fui_bootstrap --hidden --cookie "$$ERLANG_COOKIE" /flezha_ui/priv/dev/bootstrap_authz.exs

  # The same script for the sandbox runner: it reuses the UI token `bootstrap`
  # wrote, creates the namespace and issues that runner's credential.
  sandbox_bootstrap:
    extends:
      service: bootstrap
    container_name: fui_sandbox_bootstrap
    hostname: fui_sandbox_bootstrap
    profiles: [local-runner]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *sandbox-runner-credential

  db:
    image: postgres:16
    container_name: flezha_ui_db
    hostname: flezha_ui_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flezha_ui_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fui_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fui_web
    hostname: fui_web
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev
      <<: *dev-cookie
      FLEZHA_NODE: flezha@flezha_controller
      # Written by the `bootstrap` service. Read as a file rather than an env
      # var because it is issued after this container starts.
      FLEZHA_TOKEN_FILE: /auth/ui.token
      # A config or dependency change stops the console, and the restart
      # policy below brings it back with the new configuration.
      FLEZHA_UI_RESTART_ON_CONFIG_CHANGE: "true"
      # Every screen re-reads twice a second, so what a browser test caused
      # shows without waiting out a screen's own cadence.
      FLEZHA_UI_REFRESH_INTERVAL_MS: "500"
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - .:/flezha_ui
      - fui_web_deps:/flezha_ui/deps
      - fui_web_build:/flezha_ui/_build
      - fui_auth_data:/auth:ro
      # The stylebook is an npm `file:` dependency, and npm writes a relative
      # symlink for one. From assets/node_modules/@flezha/ it walks up four
      # levels, which lands on the container root — so this path is the one
      # the symlink resolves to and cannot be chosen freely. A dangling
      # symlink fails silently: @import resolves to nothing and the console
      # renders unstyled.
      - ../flezha_stylebook:/flezha_stylebook:ro
    networks:
      - fui_network
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.9.3
    container_name: fui_zookeeper
    hostname: fui_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fui_network

  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: fui_kafka
    hostname: fui_kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: fui_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fui_kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fui_network

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fui_kafka_ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: fui_kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: fui_zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - fui_network

volumes:
  fui_plugin_build:
  fui_auth_data:
  fui_socket_data:
  fui_flezha_build:
  fui_flezha_deps:
  fui_flezha_cargo_target:
  fui_web_deps:
  fui_web_build:
  fui_sandbox_build:
  fui_sandbox_deps:

networks:
  fui_network:
    driver: bridge
