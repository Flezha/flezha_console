# All-in-one dev compose: flezha controller + UI + kafka stack
# Usage:
#   docker compose -f docker-compose.dev.yml up [--build]
#
# Attach to iex:    docker attach flezha_controller  (detach: Ctrl+P Ctrl+Q)
# Get a bash shell: docker exec -it flezha_controller bash
# Restart iex:      docker exec flezha_controller pkill -f iex

services:
  controller:
    build:
      # The toolchain image is what flezha's own docker/dev/docker-compose.yml
      # builds: Elixir+OTP, Rust, Node.js, protoc against bind-mounted source.
      context: ../flezha
      dockerfile: docker/dev/Dockerfile.toolchain
    container_name: flezha_controller
    hostname: flezha_controller
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_GRACEFUL_SHUTDOWN_ENABLED: ${FLEZHA_GRACEFUL_SHUTDOWN_ENABLED:-true}
      FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-60000}
      # Off by default on the controller; on here so the UI's audit screen has
      # something to show in dev.
      FLEZHA_AUDIT_ENABLED: ${FLEZHA_AUDIT_ENABLED:-true}
    depends_on:
      kafka:
        condition: service_healthy
    # Graceful shutdown — see flezha's docs/operations/graceful_shutdown.md.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: >
      sh -c 'while true; do
        pkill node 2>/dev/null;
        echo "==> Starting flezha iex...";
        iex --sname flezha --cookie flezha_dev_cookie -S mix;
        echo "==> iex exited, restarting in 3s...";
        sleep 3;
      done'
    volumes:
      - fui_socket_data:/socket_data
      - ../flezha:/flezha
      - fui_flezha_build:/flezha/_build
      - fui_flezha_deps:/flezha/deps
      - fui_flezha_cargo_target:/flezha/target
    networks:
      - fui_network

  # The runner is its own service, mirroring flezha's docker/dev/docker-compose.yml.
  # It owns its process, so it survives a controller restart on the SDK's own
  # reconnect loop — unlike a runner launched through the controller, which dies
  # with whatever process owned its Port.
  runner:
    build:
      context: ../flezha
      dockerfile: docker/dev/Dockerfile.toolchain
    container_name: flezha_rust_runner
    restart: unless-stopped
    # The runner exits when its stdin reaches EOF, which is how a controller
    # that owns its Port shuts it down. Without an open stdin, docker hands it
    # /dev/null and it exits immediately at startup.
    stdin_open: true
    tty: true
    depends_on:
      controller:
        condition: service_started
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_DEMO_NAMESPACE: ${FLEZHA_DEMO_NAMESPACE:-default}
    working_dir: /flezha/test/apps/rust_runner
    command:
      - sh
      - -c
      - |
        until [ -S /flezha/app_data/sockets/runner_control_channel.sock ]; do
          echo "[runner] waiting for controller control socket..."
          sleep 1
        done
        exec cargo run --quiet --manifest-path=/flezha/test/apps/rust_runner/Cargo.toml -- "$$FLEZHA_DEMO_NAMESPACE"
    volumes:
      - fui_socket_data:/socket_data
      - ../flezha:/flezha
      - fui_flezha_cargo_target:/flezha/target
    networks:
      - fui_network

  db:
    image: postgres:16
    container_name: flezha_ui_db
    hostname: flezha_ui_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flezha_ui_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fui_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fui_web
    hostname: fui_web
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev
      ERLANG_COOKIE: flezha_dev_cookie
      FLEZHA_NODE: flezha@flezha_controller
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/flezha_ui
      - fui_web_deps:/flezha_ui/deps
      - fui_web_build:/flezha_ui/_build
    networks:
      - fui_network
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.9.3
    container_name: fui_zookeeper
    hostname: fui_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fui_network

  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: fui_kafka
    hostname: fui_kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: fui_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fui_kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fui_network

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fui_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: fui_kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: fui_zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - fui_network

volumes:
  fui_socket_data:
  fui_flezha_build:
  fui_flezha_deps:
  fui_flezha_cargo_target:
  fui_web_deps:
  fui_web_build:

networks:
  fui_network:
    driver: bridge
