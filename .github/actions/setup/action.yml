name: Set up the console's toolchain
description: >
  The flezha_stylebook checkout beside the console, where its assets import it
  from, and Erlang and Elixir at the versions the console's own images build with
  (deploy/Dockerfile), and Node.

inputs:
  token:
    description: A token that can read flezha/flezha_stylebook.
    required: true

runs:
  using: composite
  steps:
    - name: Check out flezha/flezha_stylebook beside the console
      uses: actions/checkout@v5
      with:
        repository: flezha/flezha_stylebook
        token: ${{ inputs.token }}
        path: flezha_stylebook

    - uses: erlef/setup-beam@v1
      with:
        otp-version: "28"
        elixir-version: "1.20.4"

    - uses: actions/setup-node@v5
      with:
        node-version: "26"
