services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flezha_console_web
    hostname: flezha_console_web
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev
      # Must match the cookie used when starting the flezha node.
      # The dev README uses: iex --sname flezha --cookie flezha_dev_cookie -S mix
      ERLANG_COOKIE: flezha_dev_cookie
      # Atom name of the flezha node. With --sname flezha inside the
      # flezha_agent_dev container the name becomes flezha@flezha_agent_dev.
      FLEZHA_NODE: flezha@flezha_agent_dev
    volumes:
      - .:/flezha_console
      - deps:/flezha_console/deps
      - build:/flezha_console/_build
    networks:
      - flezha_network

volumes:
  deps:
  build:

networks:
  flezha_network:
    external: true
